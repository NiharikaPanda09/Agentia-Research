# docker-compose.yml
version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: research_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: research_cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: research_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_MODE=postgres
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=research_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=super_secret_session_token_key_change_in_production
      # - GEMINI_API_KEY=your_gemini_api_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/workspace

  frontend:
    build: ./frontend
    container_name: research_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules

volumes:
  pgdata:
