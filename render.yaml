services:
  # 1. Backend Docker Service (FastAPI)
  - type: web
    name: research-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: research_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render dashboard after deployment


  # 2. Frontend Docker Service (Next.js)
  - type: web
    name: research-frontend
    runtime: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: research-backend
          property: host

databases:
  # 3. PostgreSQL Database (pgvector supported)
  - name: research_db
    plan: free
